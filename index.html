<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Finanzas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate-screen" class="gate-screen">
  <form id="gate-form" class="gate-box">
    <div class="gate-emoji">🔒</div>
    <h1>Mis Finanzas</h1>
    <p class="gate-sub">Ingresa la contraseña para continuar</p>
    <input type="password" id="gate-password" placeholder="Contraseña" autocomplete="current-password" autofocus required>
    <button type="submit" class="btn">Entrar</button>
    <div id="gate-error" class="gate-error"></div>
  </form>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=7"></script>
</body>
</html>
